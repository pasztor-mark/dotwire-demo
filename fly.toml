# Fly config for the dw-demo Machine (spec §12).
app = "dw-demo"            # rename if taken
primary_region = "fra"

[build]
  dockerfile = "deploy/Dockerfile"

[build.args]
  # Public site key (it ships to every browser anyway). The secret key is a Fly secret:
  #   fly secrets set TURNSTILE_SECRET_KEY=...
  NEXT_PUBLIC_TURNSTILE_SITE_KEY = "<turnstile-site-key>"

[env]
  # Must equal the hostname Turnstile reports; change with a custom domain.
  PUBLIC_HOST = "dw-demo.fly.dev"
  # Anything but "true" serves only the project landing page; Turnstile keys are then unused.
  DEMO_ENABLED = "true"

# Deploy with `fly deploy --ha=false`; keep exactly one Machine (`fly scale count 1`) — two would
# split in-memory state. No [mounts]: the rootfs is ephemeral on purpose, that's the data wipe.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
