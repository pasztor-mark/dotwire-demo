# fly.toml app configuration file generated for dotwire-demo on 2026-11-22T18:21:20Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'dotwire-demo'
primary_region = 'fra'

[build]
  dockerfile = 'deploy/Dockerfile'

  [build.args]
    NEXT_PUBLIC_TURNSTILE_SITE_KEY = '0x4AAAAAAF2zDklO-sc4qkV-'

[env]
  DEMO_ENABLED = 'true'
  PUBLIC_HOST = 'dw-demo.fly.dev'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
