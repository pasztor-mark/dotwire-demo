<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Keep title/description in sync with lib/site.ts (SITE). -->
<title>dotwire — self-hosted realtime chat</title>
<meta name="description" content="dotwire is a self-hosted realtime chat backend: private rooms, history, typing indicators and presence, behind your own auth.">
<meta property="og:title" content="dotwire — self-hosted realtime chat">
<meta property="og:description" content="dotwire is a self-hosted realtime chat backend: private rooms, history, typing indicators and presence, behind your own auth.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230d0d0c'/%3E%3Cg fill='%23f4f3ee' transform='translate(20 20) scale(.82) translate(-20 -20)'%3E%3Ccircle cx='20' cy='20' r='5'/%3E%3Ccircle cx='33' cy='20' r='5'/%3E%3Ccircle cx='26.5' cy='8.74' r='5'/%3E%3Ccircle cx='13.5' cy='8.74' r='5'/%3E%3Ccircle cx='7' cy='20' r='5'/%3E%3Ccircle cx='13.5' cy='31.26' r='5'/%3E%3Ccircle cx='26.5' cy='31.26' r='5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{color-scheme:dark;--ink:#f4f3ee;--ink2:#c8c7c1;--mute:#a09f99;--accent:oklch(0.7 0.19 35);--ok:oklch(0.7 0.19 145);--gb:rgba(255,255,255,.12);--hl:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html{background:oklch(0.15 0.06 46)}
body{margin:0;min-height:100dvh;display:grid;place-items:center;color:var(--ink);font:18px/1.5 Archivo,system-ui,sans-serif;text-transform:lowercase;padding:16px;-webkit-font-smoothing:antialiased;background:linear-gradient(180deg,oklch(0.25 0.05 62) 0%,oklch(0.19 0.07 50) 30%,oklch(0.21 0.06 56) 60%,oklch(0.15 0.06 46) 100%) fixed}
main{max-width:34rem;padding:clamp(28px,5vw,48px);border-radius:32px;background:rgba(14,14,20,.5);backdrop-filter:blur(26px) saturate(1.6);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hl),0 24px 60px oklch(0.5 0.17 40 / .22)}
h1{font-size:clamp(36px,6vw,56px);line-height:.95;font-weight:900;font-stretch:125%;letter-spacing:-.04em;margin:0 0 1rem}
p{color:var(--ink2);margin:0 0 1.5rem}
ul{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
li{display:flex;align-items:center;gap:.75rem;font-weight:700}
i{width:1rem;height:1rem;border-radius:50%;border:2px solid var(--gb);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
li.done i{animation:none;border-color:var(--ok);background:var(--ok)}
@keyframes spin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){i{animation:none}}
</style>
</head>
<body>
<main>
<h1>Waking up the demo…</h1>
<p>This demo scales to zero when nobody's using it, and all its data is wiped while it sleeps. It's starting fresh — usually a few seconds.</p>
<ul>
<li id="database"><i></i>Database</li>
<li id="bus"><i></i>Message bus</li>
<li id="gateway"><i></i>Chat gateway</li>
<li id="app"><i></i>App</li>
</ul>
</main>
<script>
(function poll(){
  fetch("/__status",{cache:"no-store"}).then(function(r){
    if(!r.ok){setTimeout(poll,1000);return}
    return r.json().then(function(s){
      var all=true;
      ["database","bus","gateway","app"].forEach(function(k){
        var done=!!(s.steps&&s.steps[k]);
        document.getElementById(k).className=done?"done":"";
        all=all&&done;
      });
      // The ready marker lands just after the last step; a short pause avoids reloading into this page again.
      if(all){setTimeout(function(){location.reload()},700);return}
      setTimeout(poll,1000);
    });
  }).catch(function(){setTimeout(poll,1000)});
})();
</script>
</body>
</html>
